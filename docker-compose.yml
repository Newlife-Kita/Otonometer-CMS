services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: otonometer_cms_app
    restart: unless-stopped
    working_dir: /var/www
    mem_limit: 2g
    volumes:
      - ./:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./docker/php/www.conf:/usr/local/etc/php-fpm.d/www.conf
    networks:
      - laravel

  nginx:
    image: nginx:alpine
    container_name: otonometer_cms_nginx
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel

networks:
  laravel:
    driver: bridge
<VirtualHost *:80>
    ServerName webcore_app
    DocumentRoot /var/www/webcore_app/public

    <Directory /var/www/webcore_app>
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Order allow,deny
        allow from all
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
